services:
  # PostgreSQL Database
  db:
    image: postgres:18-alpine
    container_name: pharmaflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pharmaflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pharmaflow_password}
      POSTGRES_DB: ${DB_NAME:-pharmaflow_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pharmaflow-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-pharmaflow} -d ${DB_NAME:-pharmaflow_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${DOCKER_IMAGE_API:-pharmaflow/api}:${DOCKER_IMAGE_TAG:-latest}
    container_name: pharmaflow-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-pharmaflow}:${DB_PASSWORD:-pharmaflow_password}@db:5432/${DB_NAME:-pharmaflow_db}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Add other environment variables as needed
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_logs:/app/apps/api/logs
    networks:
      - pharmaflow-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Web Service
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
    image: ${DOCKER_IMAGE_WEB:-pharmaflow/web}:${DOCKER_IMAGE_TAG:-latest}
    container_name: pharmaflow-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      API_URL: ${API_URL:-http://api:3000}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pharmaflow-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pharmaflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pharmaflow.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - pharmaflow-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80",
        ]
      interval: 30s
    profiles:
      - tools

networks:
  pharmaflow-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  api_logs:
    driver: local
  pgadmin_data:
    driver: local
