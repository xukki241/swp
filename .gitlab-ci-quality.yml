# Quality Check Pipeline - Lint, Format, Test, CVE
# Runs on all branches and merge requests

variables:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.18.2"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"

stages:
  - prepare
  - quality

# Cache configuration
.pnpm_cache:
  cache:
    key:
      files:
        - pnpm-lock.yaml
      prefix: pnpm-v2
    paths:
      - .pnpm-store
    policy: pull-push

.node_modules_cache:
  cache:
    key:
      files:
        - pnpm-lock.yaml
      prefix: node-modules-v2
    paths:
      - node_modules
      - apps/*/node_modules
      - packages/*/node_modules
    policy: pull

# Node.js base
.node_base:
  image: node:${NODE_VERSION}-alpine
  extends:
    - .pnpm_cache
    - .node_modules_cache
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline

# ===========================================
# PREPARE STAGE
# ===========================================

install_dependencies:
  stage: prepare
  extends:
    - .node_base
  script:
    - echo "Dependencies installed successfully"
  artifacts:
    paths:
      - node_modules
      - apps/*/node_modules
      - packages/*/node_modules
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "next"'
    - if: '$CI_COMMIT_BRANCH == "production"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*/'

# ===========================================
# QUALITY STAGE
# ===========================================

lint:
  stage: quality
  extends: .node_base
  needs: [install_dependencies]
  script:
    - echo "Running linters..."
    - pnpm lint
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.vue"
        - "**/eslint.config.js"
        - "pnpm-lock.yaml"
        - "package.json"
    - if: '$CI_COMMIT_BRANCH == "next"'
    - if: '$CI_COMMIT_BRANCH == "production"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*/'

format_check:
  stage: quality
  extends: .node_base
  needs: [install_dependencies]
  script:
    - echo "Checking code formatting..."
    - pnpm format:check
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.vue"
        - "**/*.json"
        - "**/*.md"
        - "**/*.yaml"
        - "**/*.yml"
        - "prettier.config.js"
    - if: '$CI_COMMIT_BRANCH == "next"'
    - if: '$CI_COMMIT_BRANCH == "production"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*/'

test_api:
  stage: quality
  extends: .node_base
  needs: [install_dependencies]
  services:
    - postgres:18-alpine
  variables:
    POSTGRES_DB: pharmaflow_test
    POSTGRES_USER: pharmaflow_test
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://pharmaflow_test:test_password@postgres:5432/pharmaflow_test
    NODE_ENV: test
    JWT_SECRET: test-secret-key-for-ci
  script:
    - echo "Running API tests..."
    - cd apps/api
    - pnpm test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/api/coverage/cobertura-coverage.xml
    paths:
      - apps/api/coverage/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "apps/api/**/*"
        - "packages/**/*"
        - "pnpm-lock.yaml"
        - "package.json"
    - if: '$CI_COMMIT_BRANCH == "next"'
    - if: '$CI_COMMIT_BRANCH == "production"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*/'

cve_check:
  stage: quality
  extends: .node_base
  needs: [install_dependencies]
  script:
    - echo "Checking for security vulnerabilities..."
    - pnpm audit --audit-level=moderate || true
    - echo "Running npm audit fix..."
    - pnpm audit --fix || true
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "pnpm-lock.yaml"
        - "package.json"
        - "apps/*/package.json"
        - "packages/*/package.json"
    - if: '$CI_COMMIT_BRANCH == "next"'
    - if: '$CI_COMMIT_BRANCH == "production"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*/'
