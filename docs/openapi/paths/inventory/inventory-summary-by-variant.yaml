/inventory/summary/by-variant:
  get:
    tags:
      - Inventory
    summary: Get inventory summary by variant
    description: Get aggregated inventory summary grouped by medication variant
    operationId: getInventorySummaryByVariant
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../components/common/parameters.yaml#/PageParam"
      - $ref: "../../components/common/parameters.yaml#/LimitParam"
      - $ref: "../../components/common/parameters.yaml#/SortByParam"
      - $ref: "../../components/common/parameters.yaml#/SortOrderParam"
    responses:
      "200":
        description: Inventory summary retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../../components/inventory/inventory-schemas.yaml#/InventorySummaryListResponse"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"
