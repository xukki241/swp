/warehouse/zones/{zoneId}/racks:
  get:
    tags:
      - Warehouse
    summary: List racks in a zone
    description: Retrieve a paginated list of racks within a specific zone
    operationId: listRacksInZone
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../components/common/parameters.yaml#/ZoneIdParam"
      - $ref: "../../components/common/parameters.yaml#/PageParam"
      - $ref: "../../components/common/parameters.yaml#/LimitParam"
      - $ref: "../../components/common/parameters.yaml#/SortByParam"
      - $ref: "../../components/common/parameters.yaml#/SortOrderParam"
      - $ref: "../../components/common/parameters.yaml#/SearchParam"
    responses:
      "200":
        description: Successful response
        content:
          application/json:
            schema:
              $ref: "../../components/warehouse/rack-schemas.yaml#/WarehouseRackListResponse"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "403":
        $ref: "../../components/common/responses.yaml#/ForbiddenError"
      "404":
        $ref: "../../components/common/responses.yaml#/NotFoundError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"

  post:
    tags:
      - Warehouse
    summary: Create racks in a zone
    description: Create one or more racks within a specific zone
    operationId: createRacksInZone
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../components/common/parameters.yaml#/ZoneIdParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components/warehouse/rack-schemas.yaml#/CreateWarehouseRacksRequest"
    responses:
      "201":
        description: Warehouse racks created successfully
        content:
          application/json:
            schema:
              $ref: "../../components/warehouse/rack-schemas.yaml#/CreateWarehouseRacksResponse"
      "400":
        $ref: "../../components/common/responses.yaml#/BadRequestError"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "403":
        $ref: "../../components/common/responses.yaml#/ForbiddenError"
      "404":
        $ref: "../../components/common/responses.yaml#/NotFoundError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"
