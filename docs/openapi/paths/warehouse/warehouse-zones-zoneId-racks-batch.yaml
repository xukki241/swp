/warehouse/zones/{zoneId}/racks/batch:
  post:
    tags:
      - Warehouse
    summary: Batch create racks in a zone
    description: Create multiple racks within a zone with auto-generated codes and names
    operationId: batchCreateRacksInZone
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../components/common/parameters.yaml#/ZoneIdParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components/warehouse/rack-schemas.yaml#/BatchCreateWarehouseRacks"
    responses:
      "201":
        description: Warehouse racks created successfully
        content:
          application/json:
            schema:
              $ref: "../../components/warehouse/rack-schemas.yaml#/CreateWarehouseRacksResponse"
      "400":
        $ref: "../../components/common/responses.yaml#/BadRequestError"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "403":
        $ref: "../../components/common/responses.yaml#/ForbiddenError"
      "404":
        $ref: "../../components/common/responses.yaml#/NotFoundError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"
