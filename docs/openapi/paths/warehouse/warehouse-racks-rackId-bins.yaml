/warehouse/racks/{rackId}/bins:
  get:
    tags:
      - Warehouse
    summary: List bins in a rack
    description: Retrieve a paginated list of bins within a specific rack
    operationId: listBinsInRack
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../components/common/parameters.yaml#/RackIdParam"
      - $ref: "../../components/common/parameters.yaml#/PageParam"
      - $ref: "../../components/common/parameters.yaml#/LimitParam"
      - $ref: "../../components/common/parameters.yaml#/SortByParam"
      - $ref: "../../components/common/parameters.yaml#/SortOrderParam"
      - $ref: "../../components/common/parameters.yaml#/SearchParam"
    responses:
      "200":
        description: Successful response
        content:
          application/json:
            schema:
              $ref: "../../components/warehouse/bin-schemas.yaml#/WarehouseBinListResponse"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "403":
        $ref: "../../components/common/responses.yaml#/ForbiddenError"
      "404":
        $ref: "../../components/common/responses.yaml#/NotFoundError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"

  post:
    tags:
      - Warehouse
    summary: Create bins in a rack
    description: Create one or more bins within a specific rack
    operationId: createBinsInRack
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../components/common/parameters.yaml#/RackIdParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components/warehouse/bin-schemas.yaml#/CreateWarehouseBinsRequest"
    responses:
      "201":
        description: Warehouse bins created successfully
        content:
          application/json:
            schema:
              $ref: "../../components/warehouse/bin-schemas.yaml#/CreateWarehouseBinsResponse"
      "400":
        $ref: "../../components/common/responses.yaml#/BadRequestError"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "403":
        $ref: "../../components/common/responses.yaml#/ForbiddenError"
      "404":
        $ref: "../../components/common/responses.yaml#/NotFoundError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"
