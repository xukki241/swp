/reports/{reportId}:
  get:
    tags:
      - Reports
    summary: Get report by ID
    description: Retrieve a specific report by its ID
    operationId: getReportById
    security:
      - bearerAuth: []
    parameters:
      - name: reportId
        in: path
        description: Report ID
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Report retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../../components/reports/report-schemas.yaml#/Report"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "404":
        $ref: "../../components/common/responses.yaml#/NotFoundError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"

  delete:
    tags:
      - Reports
    summary: Delete report
    description: Delete a generated report (Owner only)
    operationId: deleteReport
    security:
      - bearerAuth: []
    parameters:
      - name: reportId
        in: path
        description: Report ID
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Report deleted successfully
        content:
          application/json:
            schema:
              $ref: "../../components/common/schemas.yaml#/Response"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "403":
        $ref: "../../components/common/responses.yaml#/ForbiddenError"
      "404":
        $ref: "../../components/common/responses.yaml#/NotFoundError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"
