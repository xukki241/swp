/customers:
  get:
    tags:
      - Customers
    summary: List all customers
    description: Get paginated list of customers with optional filtering
    operationId: listCustomers
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../components/common/parameters.yaml#/PageParam"
      - $ref: "../../components/common/parameters.yaml#/LimitParam"
      - $ref: "../../components/common/parameters.yaml#/SortByParam"
      - $ref: "../../components/common/parameters.yaml#/SortOrderParam"
      - name: name
        in: query
        description: Filter by customer name
        required: false
        schema:
          type: string
      - name: email
        in: query
        description: Filter by email address
        required: false
        schema:
          type: string
      - name: phone
        in: query
        description: Filter by phone number
        required: false
        schema:
          type: string
    responses:
      "200":
        description: Customers retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../../components/customers/customer-schemas.yaml#/CustomerListResponse"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"

  post:
    tags:
      - Customers
    summary: Create customers (batch)
    description: Create one or more customers. Accepts both single customer object and array of customers
    operationId: createCustomers
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "../../components/customers/customer-schemas.yaml#/CreateCustomer"
              - $ref: "../../components/customers/customer-schemas.yaml#/CreateCustomersRequest"
          examples:
            singleCustomer:
              summary: Create a single customer
              value:
                name: "John Doe"
                email: "john.doe@example.com"
                phone: "0123456789"
                address: "123 Main Street, City, Country"
            multipleCustomers:
              summary: Create multiple customers
              value:
                - name: "John Doe"
                  email: "john.doe@example.com"
                  phone: "0123456789"
                  address: "123 Main Street, City, Country"
                - name: "Jane Smith"
                  email: "jane.smith@example.com"
                  phone: "0987654321"
                  address: "456 Oak Avenue, City, Country"
    responses:
      "201":
        description: Customers created successfully
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../../components/customers/customer-schemas.yaml#/Customer"
                - $ref: "../../components/customers/customer-schemas.yaml#/CreateCustomersResponse"
      "400":
        $ref: "../../components/common/responses.yaml#/BadRequestError"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "409":
        $ref: "../../components/common/responses.yaml#/ConflictError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"
