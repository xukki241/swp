/auth/reset-password:
  post:
    tags:
      - Auth
    summary: Reset password with token
    description: Reset user password using the OTP token received via email
    operationId: resetPassword
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components/auth/schemas.yaml#/ResetPasswordRequest"
    responses:
      "200":
        description: Password reset successful
        content:
          application/json:
            schema:
              $ref: "../../components/auth/schemas.yaml#/ResetPasswordResponse"
      "400":
        $ref: "../../components/common/responses.yaml#/BadRequestError"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"
