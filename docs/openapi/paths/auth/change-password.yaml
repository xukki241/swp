/auth/change-password:
  post:
    tags:
      - Auth
    summary: Change password
    description: Change password for authenticated user
    operationId: changePassword
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components/auth/schemas.yaml#/ChangePasswordRequest"
    responses:
      "200":
        description: Password changed successfully
        content:
          application/json:
            schema:
              $ref: "../../components/auth/schemas.yaml#/ChangePasswordResponse"
      "400":
        $ref: "../../components/common/responses.yaml#/BadRequestError"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"
