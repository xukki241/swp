/auth/forgot-password:
  post:
    tags:
      - Auth
    summary: Request password reset
    description: Request a password reset token to be sent to user's email
    operationId: forgotPassword
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components/auth/schemas.yaml#/ForgotPasswordRequest"
    responses:
      "200":
        description: Password reset email sent
        content:
          application/json:
            schema:
              $ref: "../../components/auth/schemas.yaml#/ForgotPasswordResponse"
      "400":
        $ref: "../../components/common/responses.yaml#/BadRequestError"
      "404":
        $ref: "../../components/common/responses.yaml#/NotFoundError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"
