/suppliers:
  get:
    tags:
      - Suppliers
    summary: List all suppliers
    description: Get paginated list of suppliers with optional filtering
    operationId: listSuppliers
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../components/common/parameters.yaml#/PageParam"
      - $ref: "../../components/common/parameters.yaml#/LimitParam"
      - $ref: "../../components/common/parameters.yaml#/SortByParam"
      - $ref: "../../components/common/parameters.yaml#/SortOrderParam"
      - name: name
        in: query
        description: Filter by supplier name
        required: false
        schema:
          type: string
      - name: email
        in: query
        description: Filter by email address
        required: false
        schema:
          type: string
      - name: phone
        in: query
        description: Filter by phone number
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter by supplier status
        required: false
        schema:
          $ref: "../../components/common/enums.yaml#/SupplierStatus"
    responses:
      "200":
        description: Suppliers retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../../components/suppliers/supplier-schemas.yaml#/SupplierListResponse"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"

  post:
    tags:
      - Suppliers
    summary: Create suppliers (batch)
    description: Create one or more suppliers (Owner only)
    operationId: createSuppliers
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components/suppliers/supplier-schemas.yaml#/CreateSuppliersRequest"
          example:
            - name: "ABC Pharmaceuticals"
              contactName: "John Doe"
              email: "contact@abcpharma.com"
              phone: "0123456789"
              address: "123 Medical Plaza, City, Country"
              status: "active"
            - name: "XYZ Medical Supplies"
              contactName: "Jane Smith"
              email: "info@xyzmedical.com"
              phone: "0987654321"
              address: "456 Health Avenue, City, Country"
              status: "active"
    responses:
      "201":
        description: Suppliers created successfully
        content:
          application/json:
            schema:
              $ref: "../../components/suppliers/supplier-schemas.yaml#/CreateSuppliersResponse"
      "400":
        $ref: "../../components/common/responses.yaml#/BadRequestError"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "403":
        $ref: "../../components/common/responses.yaml#/ForbiddenError"
      "409":
        $ref: "../../components/common/responses.yaml#/ConflictError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"
