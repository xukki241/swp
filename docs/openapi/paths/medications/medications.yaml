/medications:
  get:
    tags:
      - Medications
    summary: List all medications
    description: Get paginated list of medications with optional filtering
    operationId: listMedications
    parameters:
      - $ref: "../../components/common/parameters.yaml#/PageParam"
      - $ref: "../../components/common/parameters.yaml#/LimitParam"
      - $ref: "../../components/common/parameters.yaml#/SortByParam"
      - $ref: "../../components/common/parameters.yaml#/SortOrderParam"
      - name: name
        in: query
        description: Filter by medication name
        required: false
        schema:
          type: string
      - name: brand
        in: query
        description: Filter by brand name
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter by medication status
        required: false
        schema:
          $ref: "../../components/common/enums.yaml#/MedicationStatus"
      - name: isPrescriptionRequired
        in: query
        description: Filter by prescription requirement
        required: false
        schema:
          type: boolean
      - name: isControlledSubstance
        in: query
        description: Filter by controlled substance status
        required: false
        schema:
          type: boolean
    responses:
      "200":
        description: Medications retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../../components/medications/medication-schemas.yaml#/MedicationListResponse"
      "400":
        $ref: "../../components/common/responses.yaml#/BadRequestError"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"

  post:
    tags:
      - Medications
    summary: Create medications (batch)
    description: Create one or more medications
    operationId: createMedications
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components/medications/medication-schemas.yaml#/CreateMedicationsRequest"
    responses:
      "201":
        description: Medications created successfully
        content:
          application/json:
            schema:
              $ref: "../../components/medications/medication-schemas.yaml#/CreateMedicationsResponse"
      "400":
        $ref: "../../components/common/responses.yaml#/BadRequestError"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "403":
        $ref: "../../components/common/responses.yaml#/ForbiddenError"
      "409":
        $ref: "../../components/common/responses.yaml#/ConflictError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"
