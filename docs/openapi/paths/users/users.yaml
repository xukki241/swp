/users:
  get:
    tags:
      - Users
    summary: List all users
    description: Get paginated list of users with optional filtering
    operationId: listUsers
    parameters:
      - $ref: "../../components/common/parameters.yaml#/PageParam"
      - $ref: "../../components/common/parameters.yaml#/LimitParam"
      - $ref: "../../components/common/parameters.yaml#/SortByParam"
      - $ref: "../../components/common/parameters.yaml#/SortOrderParam"
      - name: email
        in: query
        description: Filter by email
        required: false
        schema:
          type: string
          format: email
      - name: phone
        in: query
        description: Filter by phone number
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter by user status
        required: false
        schema:
          $ref: "../../components/common/enums.yaml#/UserStatus"
      - name: role
        in: query
        description: Filter by user role
        required: false
        schema:
          $ref: "../../components/common/enums.yaml#/UserRole"
    responses:
      "200":
        description: Users retrieved successfully
        content:
          application/json:
            schema:
              $ref: "../../components/users/schemas.yaml#/UserListResponse"
      "400":
        $ref: "../../components/common/responses.yaml#/BadRequestError"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "403":
        $ref: "../../components/common/responses.yaml#/ForbiddenError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"

  post:
    tags:
      - Users
    summary: Create users (batch)
    description: Create one or more users (owner only)
    operationId: createUsers
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components/users/schemas.yaml#/CreateUsersRequest"
    responses:
      "201":
        description: Users created successfully
        content:
          application/json:
            schema:
              $ref: "../../components/users/schemas.yaml#/CreateUsersResponse"
      "400":
        $ref: "../../components/common/responses.yaml#/BadRequestError"
      "401":
        $ref: "../../components/common/responses.yaml#/UnauthorizedError"
      "403":
        $ref: "../../components/common/responses.yaml#/ForbiddenError"
      "409":
        $ref: "../../components/common/responses.yaml#/ConflictError"
      "500":
        $ref: "../../components/common/responses.yaml#/InternalServerError"
