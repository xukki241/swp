Customer:
  type: object
  required:
    - id
    - name
    - email
    - phone
    - address
  properties:
    id:
      $ref: "../common/schemas.yaml#/UUID"
    name:
      $ref: "../common/schemas.yaml#/Name"
    email:
      $ref: "../common/schemas.yaml#/Email"
    phone:
      $ref: "../common/schemas.yaml#/Phone"
    address:
      $ref: "../common/schemas.yaml#/Address"

CreateCustomer:
  type: object
  required:
    - name
    - email
    - phone
    - address
  properties:
    name:
      $ref: "../common/schemas.yaml#/Name"
    email:
      $ref: "../common/schemas.yaml#/Email"
    phone:
      $ref: "../common/schemas.yaml#/Phone"
    address:
      $ref: "../common/schemas.yaml#/Address"

CreateCustomersRequest:
  type: array
  items:
    $ref: "#/CreateCustomer"
  description: Array of customers to create

CreateCustomersResponse:
  allOf:
    - $ref: "../common/schemas.yaml#/SuccessResponse"
    - type: object
      properties:
        message:
          example: "Customers created successfully"
        data:
          type: array
          items:
            $ref: "#/Customer"
          description: Array of created customers

CustomerResponse:
  allOf:
    - $ref: "../common/schemas.yaml#/SuccessResponse"
    - type: object
      properties:
        message:
          example: "Customer retrieved successfully"
        data:
          $ref: "#/Customer"

DeleteCustomerResponse:
  allOf:
    - $ref: "../common/schemas.yaml#/SuccessResponse"
    - type: object
      properties:
        message:
          example: "Customer deleted successfully"
        data:
          type: object
          nullable: true
          example: null

UpdateCustomer:
  type: object
  properties:
    name:
      $ref: "../common/schemas.yaml#/Name"
    email:
      $ref: "../common/schemas.yaml#/Email"
    phone:
      $ref: "../common/schemas.yaml#/Phone"
    address:
      $ref: "../common/schemas.yaml#/Address"

CustomerListResponse:
  allOf:
    - $ref: "../common/schemas.yaml#/SuccessListResponse"
    - type: object
      properties:
        message:
          example: "Customers retrieved successfully"
        data:
          type: array
          items:
            $ref: "#/Customer"
