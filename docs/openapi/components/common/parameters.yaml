PageParam:
  name: page
  in: query
  description: Page number for pagination
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1

LimitParam:
  name: limit
  in: query
  description: Number of items per page
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10

SortByParam:
  name: sortBy
  in: query
  description: Field to sort by
  required: false
  schema:
    type: string

SortOrderParam:
  name: sortOrder
  in: query
  description: Sort direction
  required: false
  schema:
    type: string
    enum: [asc, desc]
    default: asc

SearchParam:
  name: search
  in: query
  description: Search query string
  required: false
  schema:
    type: string

