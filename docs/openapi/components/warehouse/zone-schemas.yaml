WarehouseZone:
  type: object
  required:
    - id
    - code
    - name
    - type
  properties:
    id:
      $ref: "../common/schemas.yaml#/UUID"
    code:
      $ref: "../common/schemas.yaml#/Code"
    name:
      $ref: "../common/schemas.yaml#/Name"
    type:
      $ref: "../common/enums.yaml#/WarehouseZoneType"
    location:
      type: string
      nullable: true
      description: Physical location of the zone
      example: "Building A, Floor 2"
    description:
      $ref: "../common/schemas.yaml#/Description"

CreateWarehouseZone:
  type: object
  required:
    - code
    - name
  properties:
    code:
      $ref: "../common/schemas.yaml#/Code"
    name:
      $ref: "../common/schemas.yaml#/Name"
    type:
      allOf:
        - $ref: "../common/enums.yaml#/WarehouseZoneType"
        - default: normal
    location:
      type: string
      description: Physical location of the zone
      example: "Building A, Floor 2"
    description:
      $ref: "../common/schemas.yaml#/Description"

CreateWarehouseZonesRequest:
  type: array
  items:
    $ref: "#/CreateWarehouseZone"
  description: Array of warehouse zones to create

CreateWarehouseZonesResponse:
  allOf:
    - $ref: "../common/schemas.yaml#/SuccessResponse"
    - type: object
      properties:
        message:
          example: "Warehouse zones created successfully"
        data:
          type: array
          items:
            $ref: "#/WarehouseZone"
          description: Array of created warehouse zones

WarehouseZoneResponse:
  allOf:
    - $ref: "../common/schemas.yaml#/SuccessResponse"
    - type: object
      properties:
        message:
          example: "Warehouse zone retrieved successfully"
        data:
          $ref: "#/WarehouseZone"

DeleteWarehouseZoneResponse:
  allOf:
    - $ref: "../common/schemas.yaml#/SuccessResponse"
    - type: object
      properties:
        message:
          example: "Warehouse zone deleted successfully"
        data:
          type: object
          nullable: true
          example: null

BatchCreateWarehouseZones:
  type: object
  required:
    - quantity
  properties:
    quantity:
      $ref: "../common/schemas.yaml#/PositiveInteger"
    codePrefix:
      type: string
      maxLength: 50
      default: "ZONE"
      description: Prefix for auto-generated zone codes
      example: "ZONE"
    namePrefix:
      type: string
      maxLength: 100
      default: "Zone"
      description: Prefix for auto-generated zone names
      example: "Zone"

UpdateWarehouseZone:
  type: object
  properties:
    code:
      $ref: "../common/schemas.yaml#/Code"
    name:
      $ref: "../common/schemas.yaml#/Name"
    type:
      $ref: "../common/enums.yaml#/WarehouseZoneType"
    location:
      type: string
      description: Physical location of the zone
    description:
      $ref: "../common/schemas.yaml#/Description"

WarehouseZoneListResponse:
  allOf:
    - $ref: "../common/schemas.yaml#/SuccessListResponse"
    - type: object
      properties:
        message:
          example: "Warehouse zones retrieved successfully"
        data:
          type: array
          items:
            $ref: "#/WarehouseZone"
