# GitLab CI/CD Pipeline for PharmaFlow with Azure Support
# Split into 3 separate pipelines:
#   1. Quality Check Pipeline (lint, format, test, CVE check)
#   2. API Pipeline (build + deploy)
#   3. Web Pipeline (build + deploy)
#
# Branches:
#   - next: Deploys to pharmaflow-next.{domain} (staging)
#   - production: Deploys to pharmaflow.{domain} (production)

include:
  - local: .gitlab-ci-quality.yml
  - local: .gitlab-ci-api.yml
  - local: .gitlab-ci-web.yml
