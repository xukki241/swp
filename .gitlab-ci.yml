# GitLab CI/CD Pipeline for PharmaFlow with Azure Support
# This pipeline supports deployment to:
#   - GitLab Container Registry (for self-hosted/VM deployments)
#   - Azure Container Registry + Azure App Service
#
# Branches:
#   - next: Deploys to pharmaflow-next.{domain} (staging)
#   - production: Deploys to pharmaflow.{domain} (production)

variables:
  # Node and Docker configuration
  NODE_VERSION: "22"
  PNPM_VERSION: "10.18.2"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

  # Pipeline optimization
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"

  # GitLab Container Registry (default)
  GITLAB_REGISTRY: $CI_REGISTRY
  GITLAB_IMAGE_API: $CI_REGISTRY_IMAGE/api
  GITLAB_IMAGE_WEB: $CI_REGISTRY_IMAGE/web

  # Azure Container Registry (when deploying to Azure)
  AZURE_REGISTRY: ${AZURE_ACR_LOGIN_SERVER}
  AZURE_IMAGE_API: ${AZURE_ACR_LOGIN_SERVER}/api
  AZURE_IMAGE_WEB: ${AZURE_ACR_LOGIN_SERVER}/web

stages:
  - prepare
  - test
  - build
  - deploy

# Cache configuration - Enhanced pnpm caching
.pnpm_cache:
  cache:
    key:
      files:
        - pnpm-lock.yaml
      prefix: pnpm-v2
    paths:
      - .pnpm-store
    policy: pull-push

.node_modules_cache:
  cache:
    key:
      files:
        - pnpm-lock.yaml
      prefix: node-modules-v2
    paths:
      - node_modules
      - apps/*/node_modules
      - packages/*/node_modules
    policy: pull

# Node.js base
.node_base:
  image: node:${NODE_VERSION}-alpine
  extends:
    - .pnpm_cache
    - .node_modules_cache
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline

# Docker base for GitLab Registry
.docker_gitlab_base:
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "Logging in to GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# Docker base for Azure ACR
.docker_azure_base:
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "Installing Azure CLI dependencies..."
    - apk add --no-cache bash curl python3 py3-pip gcc musl-dev python3-dev libffi-dev openssl-dev make
    - pip3 install --break-system-packages azure-cli --no-cache-dir
    - echo "Verifying Docker connection..."
    - docker info
    - echo "Logging in to Azure..."
    - az login --service-principal --username $AZURE_CLIENT_ID --password $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az account set --subscription $AZURE_SUBSCRIPTION_ID
    - echo "Logging in to Azure Container Registry (using token method)..."
    - |
      ACCESS_TOKEN=$(az acr login --name $AZURE_ACR_NAME --expose-token --output tsv --query accessToken)
      echo $ACCESS_TOKEN | docker login ${AZURE_ACR_LOGIN_SERVER} --username 00000000-0000-0000-0000-000000000000 --password-stdin

# Azure CLI base
.azure_cli_base:
  image: mcr.microsoft.com/azure-cli:latest
  before_script:
    - echo "Logging in to Azure..."
    - az login --service-principal --username $AZURE_CLIENT_ID --password $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az account set --subscription $AZURE_SUBSCRIPTION_ID

# ===========================================
# PREPARE STAGE
# ===========================================

install_dependencies:
  stage: prepare
  extends:
    - .node_base
  script:
    - echo "Dependencies installed successfully"
  artifacts:
    paths:
      - node_modules
      - apps/*/node_modules
      - packages/*/node_modules
    expire_in: 1 hour
  only:
    - merge_requests
    - next
    - production

# ===========================================
# TEST STAGE
# ===========================================

lint:
  stage: test
  extends: .node_base
  needs: [install_dependencies]
  script:
    - echo "Running linters..."
    - pnpm lint
  allow_failure: false
  only:
    - merge_requests
    - next
    - production

format_check:
  stage: test
  extends: .node_base
  needs: [install_dependencies]
  script:
    - echo "Checking code formatting..."
    - pnpm format:check
  allow_failure: true
  only:
    - merge_requests
    - next
    - production

test_api:
  stage: test
  extends: .node_base
  needs: [install_dependencies]
  services:
    - postgres:18-alpine
  variables:
    POSTGRES_DB: pharmaflow_test
    POSTGRES_USER: pharmaflow_test
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://pharmaflow_test:test_password@postgres:5432/pharmaflow_test
    NODE_ENV: test
    JWT_SECRET: test-secret-key-for-ci
  script:
    - echo "Running API tests..."
    - cd apps/api
    - pnpm test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/api/coverage/cobertura-coverage.xml
    paths:
      - apps/api/coverage/
    expire_in: 1 week
  only:
    - merge_requests
    - next
    - production

# ===========================================
# BUILD STAGE - AZURE
# ===========================================

build_api_azure:
  stage: build
  extends: .docker_azure_base
  needs: [test_api, lint]
  script:
    - echo "Building API for Azure Container Registry..."
    - echo "Registry $AZURE_ACR_LOGIN_SERVER"
    - docker build -f apps/api/Dockerfile -t $AZURE_IMAGE_API:$CI_COMMIT_SHORT_SHA -t $AZURE_IMAGE_API:$CI_COMMIT_REF_NAME .
    - echo "Pushing to Azure Container Registry..."
    - docker push $AZURE_IMAGE_API:$CI_COMMIT_SHORT_SHA
    - docker push $AZURE_IMAGE_API:$CI_COMMIT_REF_NAME
    - echo "Successfully pushed to ACR"
  only:
    - next
    - production

build_web_azure:
  stage: build
  extends: .docker_azure_base
  needs: [lint]
  script:
    - echo "Building Web for Azure Container Registry..."
    - echo "Registry $AZURE_ACR_LOGIN_SERVER"
    - docker build -f apps/web/Dockerfile -t $AZURE_IMAGE_WEB:$CI_COMMIT_SHORT_SHA -t $AZURE_IMAGE_WEB:$CI_COMMIT_REF_NAME .
    - echo "Pushing to Azure Container Registry..."
    - docker push $AZURE_IMAGE_WEB:$CI_COMMIT_SHORT_SHA
    - docker push $AZURE_IMAGE_WEB:$CI_COMMIT_REF_NAME
    - echo "Successfully pushed to ACR"
  only:
    - next
    - production

# ===========================================
# DEPLOY STAGE - AZURE
# ===========================================

deploy_azure_next:
  stage: deploy
  extends: .azure_cli_base
  needs: [build_api_azure, build_web_azure]
  script:
    - echo "Deploying to Azure App Service (Next Environment)..."
    - echo "Resource Group $AZURE_RESOURCE_GROUP"

    # Deploy API Container
    - echo "Updating API container image..."
    - |
      az webapp config container set \
        --name $AZURE_API_APP_NAME_NEXT \
        --resource-group $AZURE_RESOURCE_GROUP \
        --docker-custom-image-name ${AZURE_IMAGE_API}:next \
        --docker-registry-server-url https://${AZURE_ACR_LOGIN_SERVER}

    # Configure API Environment Variables
    - echo "Configuring API environment variables..."
    - |
      DATABASE_URL="postgresql://${AZURE_DB_USER_NEXT}:${AZURE_DB_PASSWORD_NEXT}@${AZURE_DB_HOST_NEXT}:5432/${AZURE_DB_NAME_NEXT}?sslmode=require"
      az webapp config appsettings set \
        --resource-group $AZURE_RESOURCE_GROUP \
        --name $AZURE_API_APP_NAME_NEXT \
        --settings \
          NODE_ENV=production \
          PORT=3000 \
          WEBSITES_PORT=3000 \
          DATABASE_URL="$DATABASE_URL" \
          JWT_SECRET="$JWT_SECRET_NEXT" \
          JWT_EXPIRES_IN=7d \
          CORS_ORIGIN="https://${AZURE_WEB_APP_NAME_NEXT}.azurewebsites.net"

    # Restart API
    - echo "Restarting API service..."
    - az webapp restart --name $AZURE_API_APP_NAME_NEXT --resource-group $AZURE_RESOURCE_GROUP

    # Deploy Web Container
    - echo "Updating Web container image..."
    - |
      az webapp config container set \
        --name $AZURE_WEB_APP_NAME_NEXT \
        --resource-group $AZURE_RESOURCE_GROUP \
        --docker-custom-image-name ${AZURE_IMAGE_WEB}:next \
        --docker-registry-server-url https://${AZURE_ACR_LOGIN_SERVER}

    # Configure Web Environment Variables
    - echo "Configuring Web environment variables..."
    - |
      az webapp config appsettings set \
        --resource-group $AZURE_RESOURCE_GROUP \
        --name $AZURE_WEB_APP_NAME_NEXT \
        --settings \
          WEBSITES_PORT=80 \
          VITE_API_BASE_URL="https://${AZURE_API_APP_NAME_NEXT}.azurewebsites.net/api"

    # Restart Web
    - echo "Restarting Web service..."
    - az webapp restart --name $AZURE_WEB_APP_NAME_NEXT --resource-group $AZURE_RESOURCE_GROUP

    # Wait for services
    - echo "Waiting for services to start..."
    - sleep 30

    # Display URLs
    - |
      echo "================================"
      echo "Deployment Complete!"
      echo "================================"
      echo "API URL: https://${AZURE_API_APP_NAME_NEXT}.azurewebsites.net"
      echo "Web URL: https://${AZURE_WEB_APP_NAME_NEXT}.azurewebsites.net"
      echo "================================"

  environment:
    name: azure-next
    url: https://${AZURE_WEB_APP_NAME_NEXT}.azurewebsites.net
  only:
    - next

deploy_azure_production:
  stage: deploy
  extends: .azure_cli_base
  needs: [build_api_azure, build_web_azure]
  script:
    - echo "Deploying to Azure App Service (Production Environment)..."
    - echo "Resource Group $AZURE_RESOURCE_GROUP"

    # Note: Azure Database for PostgreSQL has automated backups
    - echo "Note Azure Database automated backups are enabled"

    # Deploy API Container
    - echo "Updating API container image..."
    - |
      az webapp config container set \
        --name $AZURE_API_APP_NAME_PROD \
        --resource-group $AZURE_RESOURCE_GROUP \
        --docker-custom-image-name ${AZURE_IMAGE_API}:production \
        --docker-registry-server-url https://${AZURE_ACR_LOGIN_SERVER}

    # Configure API Environment Variables
    - echo "Configuring API environment variables..."
    - |
      DATABASE_URL="postgresql://${AZURE_DB_USER_PROD}:${AZURE_DB_PASSWORD_PROD}@${AZURE_DB_HOST_PROD}:5432/${AZURE_DB_NAME_PROD}?sslmode=require"
      az webapp config appsettings set \
        --resource-group $AZURE_RESOURCE_GROUP \
        --name $AZURE_API_APP_NAME_PROD \
        --settings \
          NODE_ENV=production \
          PORT=3000 \
          WEBSITES_PORT=3000 \
          DATABASE_URL="$DATABASE_URL" \
          JWT_SECRET="$JWT_SECRET_PROD" \
          JWT_EXPIRES_IN=7d \
          CORS_ORIGIN="https://pharmaflow.${DOMAIN}"

    # Restart API
    - echo "Restarting API service..."
    - az webapp restart --name $AZURE_API_APP_NAME_PROD --resource-group $AZURE_RESOURCE_GROUP

    # Deploy Web Container
    - echo "Updating Web container image..."
    - |
      az webapp config container set \
        --name $AZURE_WEB_APP_NAME_PROD \
        --resource-group $AZURE_RESOURCE_GROUP \
        --docker-custom-image-name ${AZURE_IMAGE_WEB}:production \
        --docker-registry-server-url https://${AZURE_ACR_LOGIN_SERVER}

    # Configure Web Environment Variables
    - echo "Configuring Web environment variables..."
    - |
      az webapp config appsettings set \
        --resource-group $AZURE_RESOURCE_GROUP \
        --name $AZURE_WEB_APP_NAME_PROD \
        --settings \
          WEBSITES_PORT=80 \
          VITE_API_BASE_URL="https://${AZURE_API_APP_NAME_PROD}.azurewebsites.net/api"

    # Restart Web
    - echo "Restarting Web service..."
    - az webapp restart --name $AZURE_WEB_APP_NAME_PROD --resource-group $AZURE_RESOURCE_GROUP

    # Wait for services
    - echo "Waiting for services to start..."
    - sleep 30

    # Display URLs
    - |
      echo "================================"
      echo "Production Deployment Complete!"
      echo "================================"
      echo "API URL: https://${AZURE_API_APP_NAME_PROD}.azurewebsites.net"
      echo "Web URL: https://pharmaflow.${DOMAIN}"
      echo "================================"

  environment:
    name: azure-production
    url: https://pharmaflow.${DOMAIN}
  only:
    - production
  when: manual

# ===========================================
# UTILITY JOBS
# ===========================================

# Rollback Azure Next
rollback_azure_next:
  stage: deploy
  extends: .azure_cli_base
  script:
    - |
      echo "Rolling back Azure Next environment..."
      echo "Note: Pull previous image tag manually or use Azure Deployment Slots"
      az webapp restart --name $AZURE_API_APP_NAME_NEXT --resource-group $AZURE_RESOURCE_GROUP
      az webapp restart --name $AZURE_WEB_APP_NAME_NEXT --resource-group $AZURE_RESOURCE_GROUP
  environment:
    name: azure-next
  only:
    - next
  when: manual

# Rollback Azure Production
rollback_azure_production:
  stage: deploy
  extends: .azure_cli_base
  script:
    - |
      echo "Rolling back Azure Production environment..."
      echo "Note: Pull previous image tag manually or use Azure Deployment Slots"
      az webapp restart --name $AZURE_API_APP_NAME_PROD --resource-group $AZURE_RESOURCE_GROUP
      az webapp restart --name $AZURE_WEB_APP_NAME_PROD --resource-group $AZURE_RESOURCE_GROUP
  environment:
    name: azure-production
  only:
    - production
  when: manual
